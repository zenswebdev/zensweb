<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>

  <link rel="stylesheet" href="blog.css">
</head>

<body>
  <div class="screen">
    <div class="blog">
      <h1>Ze BLOG</h1>

      <div class="top-bar">
        <div class="filters" id="filters"></div>
        <a href="computer.html" class="back-btn">← BACK</a>
      </div>

      <div id="posts"></div>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>
</body>

<script>
  let postsData = [];

  const postsContainer = document.getElementById("posts");
  const filtersContainer = document.getElementById("filters");

  const DEBUG_MODAL = true;
  const DEBUG_POST_ID = "site-build";

  fetch("blog.json")
    .then(res => res.json())
    .then(data => {
      postsData = data;

      postsData.sort((a, b) => new Date(a.date) - new Date(a.date));

      initFilters();
      renderPosts();
      if (DEBUG_MODAL) {
     const debugPost = postsData.find(
    post => post.id === DEBUG_POST_ID
  );

  if (debugPost) {
    openModal(debugPost);
    }
   }
  });


  function initFilters() {
    const topics = ["all", ...new Set(postsData.map(p => p.topic))];

    topics.forEach(topic => {
      const btn = document.createElement("button");
      btn.textContent = topic;
      btn.className = "filter-btn";

      if (topic === "all") btn.classList.add("active");

      btn.onclick = () => {
        document.querySelectorAll(".filter-btn")
          .forEach(b => b.classList.remove("active"));

        btn.classList.add("active");
        renderPosts(topic);
      };

      filtersContainer.appendChild(btn);
    });
  }

  function renderPosts(filter = "all") {
    postsContainer.innerHTML = "";

    const filtered = filter === "all"
      ? postsData
      : postsData.filter(p => p.topic === filter);

    filtered.forEach((post, index) => {
      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <div class="post-date">${post.date}</div>
        <div class="post-title">${post.title}</div>
        <div class="post-topic">${post.topic}</div>
      `;

      // CLICK HANDLER
      div.onclick = () => openModal(post);

      postsContainer.appendChild(div);
    });
  }
  const modal = document.getElementById("modal");
  const modalBody = document.getElementById("modal-body");
  const closeBtn = document.querySelector(".close");

  function openModal(post) {
    modal.classList.remove("hidden");

    modalBody.innerHTML = `
      <h2>${post.title}</h2>
      <p><small>${post.date} • ${post.topic}</small></p>
      <hr>
      <p>${post.content}</p>
    `;
  }

  closeBtn.onclick = () => {
    modal.classList.add("hidden");
  };

  window.onclick = (e) => {
    if (e.target === modal) {
      modal.classList.add("hidden");
    }
  };
</script>
</html>
