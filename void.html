<!-- You Died!, go back to respawn -->
<!DOCTYPE html>
<html lang="en">
<head>
<!-- Favicon -->
<link rel="icon" type="image/webp" sizes="32x32" href="assets/cat-1.webp">
<link rel="shortcut icon" href="assets/cat-1.webp" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void</title>
  <style>
body {
  margin: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 150vh;
  overflow: hidden;
}
.death-wrapper {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9999;
}

.death-text {
  color: #8b0000;
  font-size: clamp(32px, 10vw, 120px);
  letter-spacing: clamp(2px, 1vw, 6px); 
  white-space: nowrap;
  will-change: transform, opacity;
  animation: deathExpand 11s infinite, slowFade 11s infinite;
  pointer-events: none;
}

@keyframes deathExpand {
  0% {
    opacity: 0;
    transform: scale(0.8, 1.1);
    filter: blur(5px);
  }

  90% {
    filter: blur(0px);
  }

  100% {
    transform:scale(1.2, 1.5);
    filter: blur(0);
  }
}
@keyframes slowFade {
  0%   { opacity: 0; }
  20%  { opacity: 0; }
  60%  { opacity: 1; }
  70%  { opacity: 1; }
  90%  { opacity: 0; }
  100% { opacity: 0; }
}

.respawn-btn {
  position: fixed;
  top: 60%; 
  left: 50%;
  transform: translate(-50%, -50%);
  padding: clamp(6px, 1.2vw, 12px) clamp(12px, 2vw, 24px);
  font-size: clamp(10px, 2.5vw, 16px); 
  letter-spacing: clamp(1px, 0.5vw, 3px);

  color: #aaa;
  text-decoration: none;
  border: 0.5px solid #444;
  background: transparent;

  opacity: 0;
  z-index: 9999;
  pointer-events: none;
  
  animation: showRespawn 2s ease forwards;
  animation-delay: 7s;
}

.respawn-btn:hover {
  color: #fff;
  border-color: #888;
}

@keyframes showRespawn {
  to {
    opacity: 1;
    pointer-events: auto;
  }
}
.camp-scene {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.campfire {
  z-index: 3;
  max-width: 80px;
  margin-bottom: 25px;
  
}

.shadow {
  position: absolute;
  bottom: 15px;
  width: 300px;
  height: 40px;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 80%);
  animation: glowSpread 1.5s infinite;
  z-index: 1;
  image-rendering: pixelated;
}

.ground {
  position: absolute;
  bottom: 0; 
  width: 400px;
  max-width: 100vw;
  height: 80px;
  background: radial-gradient(ellipse at center, rgba(255,140,0,0.4) 0%, rgba(0,0,0,1) 60%);
  animation: glowSpread 3s infinite;
  z-index: 0;
  image-rendering: pixelated;
}

@keyframes glowSpread {
  0%   { opacity: 0.7; }
  50%  { opacity: 0.9; }
  100% { opacity: 0.7; }
}
  </style>
</head>

<body>
  
  <div class="death-wrapper">
    <div class="death-text">YOU DIED</div>
  </div>
  <a href="computer" class="respawn-btn">RESPAWN</a>
  <div class="camp-scene">
    <img src="assets/campfire-2.gif" alt="Campfire" class="campfire">
    <div class="shadow"></div>
    <div class="ground"></div>
  </div>
</body>
</html>
