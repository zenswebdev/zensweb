<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Moved</title>

  <!-- Auto redirect after 3 seconds -->
  <meta http-equiv="refresh" content="3; url=welcome" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      color: #cfcfcf;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    a {
      display: inline-block;
      text-decoration: none;
      color: #111;
      background: #f5f5f5;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.25s ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    .small {
      margin-top: 1rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sorry for the inconvenience</h1>

    <p>
      This page has been moved to a new location.<br>
      You will be redirected automatically shortly.
    </p>

    <a href="welcome">Go to welcome.html</a>

    <div class="small">
      Redirecting in 3 seconds...
    </div>
  </div>

</body>
</html>
